[workspace]
members = [".", "xtask"]

[workspace.dependencies]
hf-hub = "0.4"
anyhow = "1.0"

[package]
name = "mlx-nemo"
version = "0.1.0"
edition = "2021"
description = "NeMo-compatible ASR and speech AI library for Apple Silicon, built on MLX"
license = "Apache-2.0"
repository = "https://github.com/your-org/mlx-nemo-rs"
keywords = ["asr", "speech", "mlx", "nemo", "machine-learning"]
categories = ["science", "multimedia::audio"]

[features]
default = ["asr"]
asr = ["dep:hound", "dep:rubato"]
# Future features
# tts = []
# llm = []

[dependencies]
# MLX bindings
mlx-rs = { version = "0.25", features = ["safetensors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
thiserror = "2.0"

# Archive handling (.nemo files are TAR archives)
tar = "0.4"
flate2 = "1.0"

# Audio processing (for ASR feature)
hound = { version = "3.5", optional = true }
rubato = { version = "0.16", optional = true }

# Tokenization
sentencepiece = "0.11"

# Utilities
tracing = "0.1"
tempfile = "3.24.0"

[dev-dependencies]
# For examples and tests
tokio = { version = "1.0", features = ["full"] }
