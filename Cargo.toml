[workspace]
members = [".", "xtask"]

[workspace.dependencies]
hf-hub = "0.4"
anyhow = "1.0"

[package]
name = "mlx-voice"
version = "0.2.0"
edition = "2024"
description = "NeMo-compatible ASR and speech AI library for Apple Silicon, built on MLX"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/animaslabs/mlx-voice-rs"
keywords = ["asr", "speech", "mlx", "nemo", "machine-learning"]
categories = ["science", "multimedia::audio"]
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/AUTHORS"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

[features]
default = ["asr"]
asr = ["dep:hound", "dep:rubato"]
# Expose building blocks (encoder layers, decoders, streaming caches, checkpoint
# parsing) for research and debugging tools. No stability guarantees.
internals = []
# Download models from the Hugging Face Hub in `from_pretrained`
hub = ["dep:hf-hub"]
# Future features
# tts = []
# llm = []

[dependencies]
# MLX bindings
mlx-rs = { version = "0.32", features = ["safetensors", "metal", "accelerate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"

# Error handling
thiserror = "2.0"

# Archive handling (.nemo files are TAR archives)
tar = "0.4"
flate2 = "1.1"
zip = "9.0"

# Byte manipulation
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.7"

# Audio processing (for ASR feature)
hound = { version = "3.5", optional = true }
rubato = { version = "5.0", optional = true }

# Hugging Face Hub downloads (blocking client, rustls)
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }

# Tokenization
sentencepiece = "0.14"

# Utilities
tracing = "0.1"
tempfile = "3.27.0"

[dev-dependencies]
# For examples and tests
tokio = { version = "1.53", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# For live microphone example
cpal = "0.18"       # Cross-platform audio I/O (microphone capture)
ringbuf = "0.5"     # Lock-free SPSC ring buffer for audio thread communication
ctrlc = "3.5"       # Graceful Ctrl+C handling

# Debugging tools that compare internals against NeMo
[[example]]
name = "compare_encoder"
required-features = ["internals"]

[[example]]
name = "debug_decoder"
required-features = ["internals"]

[[example]]
name = "debug_decoder_isolated"
required-features = ["internals"]

[[example]]
name = "debug_encoder"
required-features = ["internals"]

[[example]]
name = "debug_subsampling"
required-features = ["internals"]

[[example]]
name = "mel_test"
required-features = ["internals"]

[[example]]
name = "trace_streaming"
required-features = ["internals"]

[[test]]
name = "pytorch_loading"
required-features = ["internals"]

[[test]]
name = "hub"
required-features = ["hub"]
