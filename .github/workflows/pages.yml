name: Docs

# Publishes rustdoc to GitHub Pages: docs.rs can't build MLX, so this is where
# the `documentation` link in Cargo.toml points. Runs for each release tag, so
# the docs match the version on crates.io. Run it by hand to publish a given
# ref (e.g. v0.2.0).
#
# One-time setup: Settings → Pages → Source: GitHub Actions, and add a v*
# tag rule to the github-pages environment's deployment branches and tags.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to document
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --package mlx-voice --no-deps --all-features --locked
      - run: echo '<meta http-equiv="refresh" content="0; url=mlx_voice/">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}mlx_voice/
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
