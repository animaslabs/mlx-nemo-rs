name: Release

# Publishes to crates.io when a vX.Y.Z tag is pushed. Bump the version in
# Cargo.toml and add a "## X.Y.Z (date)" CHANGELOG entry in a PR first, then
# tag the merged commit:
#
#   git tag -s vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z
#
# Publishing authenticates with crates.io Trusted Publishing (no API token).
# One-time setup:
# - crates.io: mlx-voice → Settings → Trusted Publishing → add GitHub
#   repository animaslabs/mlx-voice-rs, workflow release.yml, environment release
# - GitHub: Settings → Environments → "release", with a required reviewer and
#   a deployment rule for tags matching v*
#
# cargo-semver-checks fails a release that breaks the API without the
# matching version bump (a minor bump before 1.0).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # Same as ci.yml, so the publish job can restore main's CI build cache
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: macos-15
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          cache-directories: ~/.mlx
          save-if: false

      - name: Check tag, Cargo.toml version and CHANGELOG agree
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "mlx-voice") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          # A dated heading, e.g. "## 0.3.0 (2026-10-20)", not "(unreleased)"
          escaped=$(printf '%s' "$version" | sed 's/\./\\./g')
          if ! grep -Eq "^## $escaped \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## $version (YYYY-MM-DD)' entry"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check semver against the last published release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: mlx-voice

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish --package mlx-voice --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The CHANGELOG section for this version, without its heading
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
