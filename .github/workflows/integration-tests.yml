name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v1

      - name: Download models
        run: |
          cargo xtask download animaslabs/parakeet-rnnt-0.6b-mlx
          cargo xtask download animaslabs/nemotron-speech-streaming-en-0.6b-mlx-8bit
          cargo xtask download nvidia/Frame_VAD_Multilingual_MarbleNet_v2.0

      - name: Run unit tests
        run: cargo test -- --test-threads=1

      - name: Run integration tests
        run: cargo test -- --ignored --test-threads=1
